name: codenotch
description: "A macOS Flutter app that pins a small black notch to a screen edge, showing coding assistant usage limits."
publish_to: 'none'
version: 1.5.0+7

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.2.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - docs/design/
